<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Credit Cards - CardGrid</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Same header as index.html -->
    <header class="header">
        <!-- Navigation with fuel-cards.html as active -->
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Fuel Credit Cards</h1>
                <p>Save more on fuel with these specially designed credit cards offering cashback and rewards on petrol and diesel purchases.</p>
            </div>
        </section>

        <section class="cards-section">
            <div class="container">
                <div class="filters">
                    <select class="filter-select">
                        <option>All Fuel Cards</option>
                        <option>Cashback Cards</option>
                        <option>Reward Points Cards</option>
                        <option>Premium Cards</option>
                    </select>
                </div>

                <div class="credit-cards-grid">
                    <!-- Fuel-specific credit cards -->
                </div>
            </div>
        </section>
    </main>

    <!-- Same footer as index.html -->
    <footer class="footer">
        <!-- Footer content -->
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
